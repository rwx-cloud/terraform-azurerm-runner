on:
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
  github:
    pull_request:
      init:
        commit-sha: ${{ event.git.sha }}
    push:
      init:
        commit-sha: ${{ event.git.sha }}

base:
  image: ubuntu:26.04
  config: rwx/base 1.2.1

tasks:
  - key: code
    call: git/clone 2.4.0
    with:
      repository: https://github.com/rwx-cloud/terraform-azurerm-runner.git
      ref: ${{ init.commit-sha }}

  - key: terraform
    call: hashicorp/install-terraform 1.1.3
    with:
      terraform-version: "1.15.8"

  - key: fmt
    use: [code, terraform]
    run: terraform fmt -check -recursive -diff

  - key: validate
    use: [code, terraform]
    run: |
      for directory in . examples/basic; do
        terraform -chdir="$directory" init -backend=false -input=false
        terraform -chdir="$directory" validate
      done
